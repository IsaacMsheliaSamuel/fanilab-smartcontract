version: 2
updates:
  # Maintain dependencies for Cargo
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "fanilab-team"
    labels:
      - "refactor"
      - "enhancement"
    commit-message:
      prefix: "chore"
      include: "scope"
  
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "refactor"
      - "test"
    commit-message:
      prefix: "ci"
